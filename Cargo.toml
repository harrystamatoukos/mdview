[package]
name = "mdview"
version = "0.1.6"
edition = "2024"
authors = ["Harry Stamatoukos"]
description = "A beautiful terminal markdown viewer with editorial aesthetics"
license = "MIT"
repository = "https://github.com/harrystamatoukos/mdview"
readme = "README.md"
keywords = ["markdown", "viewer", "terminal", "tui", "reader"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
# Markdown parsing
pulldown-cmark = "0.12"

# TUI framework
ratatui = "0.30"
crossterm = "0.29"

# File watching for --watch mode
notify = "7.0"

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Error handling
anyhow = "1.0"

# Chart spec parsing (```chart fenced blocks). serde_yaml_ng is the maintained
# libyaml-backed fork of the (archived) serde_yaml, same serde API. indexmap
# preserves pie-slice insertion order from the YAML.
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
indexmap = { version = "2.2", features = ["serde"] }

# --- Rich reader mode (--rich): proportional-font page rendering ---
# Enabled by default; build with --no-default-features for the classic TUI-only binary.
cosmic-text = { version = "0.19", optional = true }
# Disable default features to avoid the chafa C-library dependency; we only
# need the crossterm integration and image codecs.
#
# Vendored (see vendor/ratatui-image): a one-function patch zlib-compresses the
# kitty graphics transmit (`o=z`). Upstream sends raw RGBA, which for the rich
# reader's large per-band images costs ~650 ms per band on the UI thread and is
# the dominant scroll-jank source. Everything else is byte-for-byte upstream.
ratatui-image = { path = "vendor/ratatui-image", optional = true, default-features = false, features = ["crossterm", "image-defaults"] }
image = { version = "0.25", optional = true }
# Zlib for the kitty `o=z` transmit of the selection-highlight overlay (same
# compressor the vendored ratatui-image patch uses for bands).
miniz_oxide = { version = "0.8", optional = true }
# Native chart rasterization for ```chart blocks (no browser). Pure-Rust font
# (ab_glyph) so there's no system-font/fontconfig dependency.
plotters = { version = "0.3", optional = true, default-features = false, features = [
    "bitmap_backend",
    "ab_glyph",
    "line_series",
    "point_series",
    "histogram",
] }

[dev-dependencies]
# Used by an offline test that verifies a representative rendered band's RGBA
# compresses far smaller than raw (the premise behind the vendored kitty `o=z`
# transmit). Same compressor the vendored crate uses, so the ratio is faithful.
miniz_oxide = "0.8"

[features]
default = ["rich"]
rich = ["dep:cosmic-text", "dep:ratatui-image", "dep:image", "dep:miniz_oxide", "dep:plotters"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
